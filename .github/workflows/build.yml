name: Build & Run

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests with Maven
        run: |
          mkdir -p test/screenshot
          mvn --no-transfer-progress clean test 2>&1 | tee test/screenshot/test-output.txt

      - name: Build with Maven
        run: mvn --no-transfer-progress package -DskipTests=true

      - name: Run JAR and capture screenshot
        run: java -jar target/hello-world.jar 2>&1 | tee test/screenshot/run-output.txt

      - name: Upload screenshot evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-evidence-java21
          path: test/screenshot/**
          retention-days: 90

      - name: Commit screenshot evidence back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/screenshot/
          if ! git diff --cached --quiet; then
            git commit -m "ci: persist screenshot evidence for java21 [skip ci]"
            git push
          else
            echo "No changes to test/screenshot/ — skipping commit"
          fi
